[package]
name = "libreoffice-collab"
version = "1.0.0"
description = "Edicao colaborativa em tempo real de documentos LibreOffice na rede local"
authors = ["LibreOffice Collab contributors"]
license = "MIT"
repository = "https://github.com/Cmprfda/libreoffice-collab"
edition = "2021"
rust-version = "1.77"

# The binary is a thin wrapper around this library so integration tests and the
# Tauri mobile tooling can both reach `run()`.
[lib]
name = "libreoffice_collab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "rt", "sync", "macros"] }

# Only ever talks to the LAN over plain HTTP, but TLS is kept available so a
# hardened deployment can front the host server with HTTPS.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }

# Pinned: the ServiceEvent enum changed shape in later releases.
mdns-sd = "=0.11.1"

url = "2"
anyhow = "1"
log = "0.4"

[profile.release]
# Smallest possible installer: LTO, one codegen unit, no panic unwinding tables.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
