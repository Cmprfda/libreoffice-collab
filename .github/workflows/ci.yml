name: CI

# Fast feedback on every push: types, formatting and a compile check of both
# Rust crates. The full installer is only built on tagged releases.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Typecheck and compile
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            server

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and build the frontend
        # Also produces dist/, which src-tauri needs in order to compile.
        run: npm run build

      - name: Generate icons
        run: npm run icons

      - name: Check the client
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Check the host server
        working-directory: server
        run: cargo clippy --all-targets -- -D warnings

      - name: Check the Python host server
        working-directory: server
        run: python -m py_compile collab_server.py

      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo fmt --manifest-path server/Cargo.toml --check
